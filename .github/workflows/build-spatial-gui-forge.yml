name: Build Spatial GUI Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patch.py'
      - '.github/workflows/build-spatial-gui-forge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Set up build JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Spatial GUI source
        run: |
          git clone https://github.com/tastytrash/Spatial-GUI.git Spatial-GUI
          cd Spatial-GUI
          git checkout 52cdf9e267d9c689da866dde66a85db0fc5593f0

      - name: Apply Forge 1.20.1 port
        run: python3 patch.py Spatial-GUI

      - name: Activate Stonecutter Forge 1.20.1 source
        working-directory: Spatial-GUI
        run: |
          chmod +x gradlew
          sed -i 's/stonecutter active "1.20.1-forge"/stonecutter active "26.1.2-fabric"/' stonecutter.gradle.kts
          echo "Before switch:"
          grep 'stonecutter active' stonecutter.gradle.kts
          ./gradlew "Set active project to 1.20.1-forge" --no-daemon --max-workers=1
          echo "After switch:"
          grep 'stonecutter active' stonecutter.gradle.kts

      - name: Diagnostic Stonecutter state
        working-directory: Spatial-GUI
        continue-on-error: true
        run: |
          echo "=== Root Vulkan source ==="
          sed -n '1,80p' src/main/java/org/tastytrash/spatialGUI/compat/VulkanModCompat.java || true
          echo "=== Remaining Fabric references in root src ==="
          grep -R --line-number 'net\.fabricmc' src/main/java || true
          echo "=== 1.20.1-forge node files ==="
          find versions/1.20.1-forge -maxdepth 4 -type f | sort | head -200 || true

      - name: Generate and build Forge 1.20.1 target
        working-directory: Spatial-GUI
        env:
          CI: 'true'
        run: |
          ./gradlew             :1.20.1-forge:clean             :1.20.1-forge:stonecutterGenerate             :1.20.1-forge:build             --stacktrace             --no-daemon             --max-workers=1

      - name: Collect distributable jar
        run: |
          mkdir -p out
          echo 'JAR candidates:'
          find Spatial-GUI -type f -path '*/build/libs/*.jar' -print
          find Spatial-GUI -type f -path '*/build/libs/*.jar'             ! -name '*sources*'             ! -name '*dev*'             ! -name '*javadoc*'             -exec cp -v {} out/ \;
          test -n "$(find out -type f -name '*.jar' -print -quit)"

      - name: Upload Forge build
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-1.20.1-forge
          path: out/*.jar
          if-no-files-found: error
